<h2>Rombusz területe</h2>
<form [formGroup]="rombatloForm" (ngSubmit)="startCalc()">
  <div>
    <label for="e">Első átló</label>
    <input type="number" id="e" formControlName="e" step="any" (input)="showArea = false">
    @if (rombatloForm.get('e')?.invalid && rombatloForm.get('e')?.touched) {
      <p class="error">Adj meg pozitív számot!</p>
    }
  </div>
  <div>
    <label for="f">Második átló</label>
    <input type="number" id="f" formControlName="f" step="any" (input)="showArea = false">
    @if (rombatloForm.get('f')?.invalid && rombatloForm.get('f')?.touched) {
      <p class="error">Adj meg pozitív számot!</p>
    }
  </div>
  <button type="submit">Számít</button>
  @if (showArea) {
    <div>
      <label for="area">Terület</label>
      <input type="text" id="area" formControlName="area" readonly>
    </div>
  }
</form>
